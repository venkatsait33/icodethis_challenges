<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social-profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="w-full h-100 bg-slate-200 flex justify-center item-center">
        <div class="grid max-sm:grid-cols-1 md:grid-cols-2 p-10 gap-6 mt-10">
            <div class="bg-white shadow-lg rounded-lg p-6 w-[200px] mx-auto flex flex-col items-center h-[250px]">
                <picture>
                    <img src="https://media.istockphoto.com/id/1437816897/photo/business-woman-manager-or-human-resources-portrait-for-career-success-company-we-are-hiring.jpg?s=612x612&w=0&k=20&c=tyLvtzutRh22j9GqSGI33Z4HpIwv9vL_MZw_xOE19NQ="
                        alt="" class="w-20 h-20 rounded-full">
                </picture>
                <h1 class="text-xl font-bold mt-2">Sally Ramos</h1>
                <h3>@sallytheramos</h3>
                <button class="border-2 w-24 m-6 p-1 rounded-xl">following</button>
            </div>

            <div class=" bg-white shadow-lg rounded-lg p-6 w-[350px] mx-auto flex flex-col items-center">
                <div class="flex justify-between w-full">
                    <picture>
                        <img src="https://media.istockphoto.com/id/1437816897/photo/business-woman-manager-or-human-resources-portrait-for-career-success-company-we-are-hiring.jpg?s=612x612&w=0&k=20&c=tyLvtzutRh22j9GqSGI33Z4HpIwv9vL_MZw_xOE19NQ="
                            alt="" class="w-20 h-20 rounded-full">
                    </picture>
                    <button class="border-2 w-24 m-6 p-1 rounded-xl">following</button>
                </div>
                <div class="m-2">
                    <h1 class="text-xl font-bold mt-2">Sally Ramos</h1>
                    <h4>sallytheramos</h4>
                    </br>
                    <p>Product Designer at @company. Working on @othercompany in my fee time</p>

                </div>
            </div>

            <div class="w-[500px] mx-auto bg-white shadow-lg rounded-lg p-6">
                <div class="flex justify-between w-full">
                    <figure>
                        <img src="https://media.istockphoto.com/id/1437816897/photo/business-woman-manager-or-human-resources-portrait-for-career-success-company-we-are-hiring.jpg?s=612x612&w=0&k=20&c=tyLvtzutRh22j9GqSGI33Z4HpIwv9vL_MZw_xOE19NQ="
                            alt="" class="w-20 h-20 rounded-full">
                    </figure>
                    <button class="border-2 w-24 m-6 p-1 rounded-2xl text-white bg-black">follow</button>
                </div>
                <div class="m-2">
                    <h1 class="text-xl font-bold mt-2">Sally Ramos</h1>
                    <h4>@sallytheramos</h4>
                    </br>
                    <p class="font-semibold">Product Designer at @company. Working on @othercompany in my fee time</p>

                    <div class="flex mt-4 font-[300] gap-1 ">
                        <p>15K Followers</p>
                        <p>.</p>
                        <p>7K Following</p>
                        <p>.</p>
                        <p>Since April 30, 2017</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
